/* ========================================
   沐浴录 · 样式系统
   主题：水润、清新、流动、安静
   ======================================== */

/* ---------- 设计变量 ---------- */
:root {
  /* 主色：水青色系 */
  --c-primary: #0891b2;
  --c-primary-light: #06b6d4;
  --c-primary-dark: #155e75;
  --c-accent: #7c3aed;
  --c-foam: #ecfeff;

  /* 中性色 */
  --c-ink: #1e293b;
  --c-ink-soft: #475569;
  --c-ink-mute: #94a3b8;
  --c-line: #e2e8f0;

  /* 背景 */
  --bg-base: #f0f9ff;
  --bg-soft: #f8fafc;
  --bg-card: rgba(255, 255, 255, 0.72);
  --bg-glass: rgba(255, 255, 255, 0.55);

  /* 字体 */
  --font-serif: 'Noto Serif SC', 'Songti SC', 'STSong', serif;
  --font-sans: 'Noto Sans SC', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;

  /* 圆角与阴影 */
  --radius: 16px;
  --radius-sm: 10px;
  --shadow-sm: 0 2px 12px rgba(8, 145, 178, 0.06);
  --shadow-md: 0 8px 30px rgba(8, 145, 178, 0.10);
  --shadow-lg: 0 20px 60px rgba(8, 145, 178, 0.15);

  /* 容器 */
  --container: 880px;
  --container-wide: 1100px;

  /* 动效 */
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}

/* ---------- 重置 ---------- */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }

body {
  font-family: var(--font-sans);
  color: var(--c-ink);
  background: var(--bg-base);
  line-height: 1.75;
  font-size: 16px;
  overflow-x: hidden;
  min-height: 100vh;
}

a { color: inherit; text-decoration: none; }
img { max-width: 100%; display: block; }
button { font-family: inherit; cursor: pointer; border: none; background: none; }

::selection { background: rgba(6, 182, 212, 0.2); }

/* ---------- 动态水波背景 ---------- */
.water-bg {
  position: fixed;
  inset: 0;
  z-index: -1;
  background:
    radial-gradient(ellipse at 20% 0%, rgba(165, 243, 252, 0.5), transparent 50%),
    radial-gradient(ellipse at 80% 100%, rgba(204, 251, 241, 0.5), transparent 50%),
    radial-gradient(ellipse at 50% 50%, rgba(224, 242, 254, 0.4), transparent 70%),
    linear-gradient(180deg, #f0f9ff 0%, #ecfeff 50%, #f0fdfa 100%);
  overflow: hidden;
}

/* 气泡 */
.bubble {
  position: absolute;
  bottom: -60px;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.9), rgba(165,243,252,0.3));
  box-shadow: inset 0 0 8px rgba(255,255,255,0.5);
  animation: rise linear infinite;
  opacity: 0;
}
.bubble-1 { left: 8%;  width: 50px;  height: 50px;  animation-duration: 18s; animation-delay: 0s; }
.bubble-2 { left: 25%; width: 24px;  height: 24px;  animation-duration: 14s; animation-delay: 4s; }
.bubble-3 { left: 50%; width: 70px;  height: 70px;  animation-duration: 22s; animation-delay: 8s; }
.bubble-4 { left: 72%; width: 32px;  height: 32px;  animation-duration: 16s; animation-delay: 2s; }
.bubble-5 { left: 90%; width: 42px;  height: 42px;  animation-duration: 20s; animation-delay: 6s; }

@keyframes rise {
  0%   { transform: translateY(0) scale(0.6); opacity: 0; }
  10%  { opacity: 0.5; }
  90%  { opacity: 0.3; }
  100% { transform: translateY(-110vh) scale(1.1); opacity: 0; }
}

/* 水波纹 */
.ripple {
  position: absolute;
  top: 50%; left: 50%;
  width: 200px; height: 200px;
  margin: -100px 0 0 -100px;
  border: 2px solid rgba(8, 145, 178, 0.08);
  border-radius: 50%;
  animation: ripple 8s ease-out infinite;
}
.ripple-2 { animation-delay: 4s; }

@keyframes ripple {
  0%   { transform: scale(0.3); opacity: 0.6; }
  100% { transform: scale(4); opacity: 0; }
}

/* ---------- 顶部导航 ---------- */
.site-header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(255, 255, 255, 0.7);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border-bottom: 1px solid rgba(226, 232, 240, 0.6);
  transition: box-shadow 0.3s var(--ease);
}
.site-header.scrolled { box-shadow: var(--shadow-sm); }

.header-inner {
  max-width: var(--container-wide);
  margin: 0 auto;
  padding: 0 24px;
  height: 68px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
}
.logo-icon { font-size: 28px; filter: drop-shadow(0 2px 4px rgba(8,145,178,0.3)); }
.logo-text { display: flex; flex-direction: column; line-height: 1; }
.logo-name {
  font-family: var(--font-serif);
  font-size: 20px;
  font-weight: 700;
  color: var(--c-primary-dark);
  letter-spacing: 2px;
}
.logo-sub {
  font-size: 10px;
  color: var(--c-ink-mute);
  letter-spacing: 3px;
  text-transform: uppercase;
  margin-top: 2px;
}

.main-nav {
  display: flex;
  gap: 4px;
}
.main-nav a {
  position: relative;
  padding: 8px 18px;
  font-size: 15px;
  font-weight: 500;
  color: var(--c-ink-soft);
  border-radius: 8px;
  transition: all 0.25s var(--ease);
}
.main-nav a::after {
  content: '';
  position: absolute;
  bottom: 2px;
  left: 50%;
  width: 0;
  height: 2px;
  background: var(--c-primary);
  border-radius: 2px;
  transform: translateX(-50%);
  transition: width 0.3s var(--ease);
}
.main-nav a:hover { color: var(--c-primary); }
.main-nav a.active { color: var(--c-primary); font-weight: 600; }
.main-nav a.active::after { width: 24px; }

.nav-toggle { display: none; }

/* ---------- 主内容 ---------- */
.site-main {
  max-width: var(--container-wide);
  margin: 0 auto;
  padding: 48px 24px 80px;
  min-height: 60vh;
}

/* 页面过渡动画 */
.page-enter {
  animation: pageEnter 0.5s var(--ease) both;
}
@keyframes pageEnter {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ========================================
   首页 / 文章列表
   ======================================== */

/* Hero 区 */
.hero {
  text-align: center;
  padding: 60px 0 56px;
  position: relative;
}
.hero-emoji { font-size: 56px; display: block; margin-bottom: 20px; animation: float 4s ease-in-out infinite; }
@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}
.hero h1 {
  font-family: var(--font-serif);
  font-size: clamp(32px, 5vw, 52px);
  font-weight: 700;
  color: var(--c-primary-dark);
  letter-spacing: 4px;
  margin-bottom: 16px;
  text-shadow: 0 2px 20px rgba(8, 145, 178, 0.1);
}
.hero-tagline {
  font-size: 17px;
  color: var(--c-ink-soft);
  max-width: 460px;
  margin: 0 auto 12px;
  line-height: 1.9;
}
.hero-wave {
  width: 60px;
  height: 3px;
  background: linear-gradient(90deg, transparent, var(--c-primary), transparent);
  margin: 24px auto 0;
  border-radius: 2px;
}

/* 文章列表 */
.section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 28px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--c-line);
}
.section-head h2 {
  font-family: var(--font-serif);
  font-size: 22px;
  font-weight: 600;
  color: var(--c-ink);
}
.section-head .count {
  font-size: 13px;
  color: var(--c-ink-mute);
}

.article-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 24px;
}

/* 文章卡片 */
.article-card {
  background: var(--bg-card);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.6);
  border-radius: var(--radius);
  padding: 28px 26px;
  box-shadow: var(--shadow-sm);
  transition: all 0.4s var(--ease);
  cursor: pointer;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.article-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  height: 3px;
  background: linear-gradient(90deg, var(--c-primary-light), var(--c-accent));
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.4s var(--ease);
}
.article-card:hover {
  transform: translateY(-6px);
  box-shadow: var(--shadow-lg);
  border-color: rgba(6, 182, 212, 0.3);
}
.article-card:hover::before { transform: scaleX(1); }

.card-cover {
  font-size: 40px;
  margin-bottom: 16px;
  display: inline-block;
}
.card-date {
  font-size: 12px;
  color: var(--c-ink-mute);
  margin-bottom: 8px;
  letter-spacing: 0.5px;
}
.card-title {
  font-family: var(--font-serif);
  font-size: 20px;
  font-weight: 600;
  color: var(--c-ink);
  margin-bottom: 12px;
  line-height: 1.4;
  transition: color 0.3s;
}
.article-card:hover .card-title { color: var(--c-primary); }
.card-excerpt {
  font-size: 14px;
  color: var(--c-ink-soft);
  line-height: 1.8;
  flex: 1;
  margin-bottom: 18px;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.card-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.tag {
  display: inline-flex;
  align-items: center;
  font-size: 12px;
  font-weight: 500;
  padding: 3px 12px;
  border-radius: 20px;
  background: rgba(6, 182, 212, 0.1);
  color: var(--c-primary);
  transition: all 0.25s var(--ease);
  cursor: pointer;
}
.tag:hover { background: rgba(6, 182, 212, 0.2); transform: translateY(-1px); }
.tag::before { content: '#'; margin-right: 2px; opacity: 0.6; }

/* ========================================
   文章详情页
   ======================================== */
.article-detail {
  max-width: var(--container);
  margin: 0 auto;
}
.article-detail .back-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 14px;
  color: var(--c-ink-soft);
  margin-bottom: 32px;
  padding: 6px 14px 6px 10px;
  border-radius: 20px;
  background: var(--bg-glass);
  transition: all 0.25s var(--ease);
}
.article-detail .back-link:hover { color: var(--c-primary); background: rgba(6,182,212,0.12); transform: translateX(-3px); }

.detail-header {
  text-align: center;
  margin-bottom: 40px;
  padding-bottom: 32px;
  border-bottom: 1px solid var(--c-line);
}
.detail-cover { font-size: 56px; display: block; margin-bottom: 20px; }
.detail-title {
  font-family: var(--font-serif);
  font-size: clamp(28px, 4vw, 40px);
  font-weight: 700;
  color: var(--c-ink);
  line-height: 1.3;
  margin-bottom: 20px;
}
.detail-meta {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  flex-wrap: wrap;
  font-size: 13px;
  color: var(--c-ink-mute);
}
.detail-meta .sep { color: var(--c-line); }
.detail-meta .reading { display: inline-flex; align-items: center; gap: 4px; }
.detail-tags { display: flex; gap: 8px; justify-content: center; margin-top: 18px; }

/* Markdown 正文排版 */
.markdown-body {
  font-size: 17px;
  line-height: 2;
  color: var(--c-ink);
}
.markdown-body h1 {
  font-family: var(--font-serif);
  font-size: 30px;
  font-weight: 700;
  margin: 8px 0 28px;
  color: var(--c-primary-dark);
  line-height: 1.3;
}
.markdown-body h2 {
  font-family: var(--font-serif);
  font-size: 23px;
  font-weight: 600;
  margin: 44px 0 18px;
  color: var(--c-ink);
  position: relative;
  padding-left: 16px;
}
.markdown-body h2::before {
  content: '';
  position: absolute;
  left: 0; top: 50%;
  width: 4px; height: 22px;
  background: linear-gradient(180deg, var(--c-primary-light), var(--c-accent));
  border-radius: 2px;
  transform: translateY(-50%);
}
.markdown-body h3 {
  font-family: var(--font-serif);
  font-size: 19px;
  font-weight: 600;
  margin: 32px 0 14px;
  color: var(--c-ink);
}
.markdown-body p { margin-bottom: 22px; }
.markdown-body strong { color: var(--c-primary-dark); font-weight: 600; }
.markdown-body em { color: var(--c-accent); font-style: normal; }
.markdown-body a {
  color: var(--c-primary);
  border-bottom: 1px dashed var(--c-primary);
  transition: all 0.2s;
}
.markdown-body a:hover { color: var(--c-accent); border-bottom-color: var(--c-accent); }

.markdown-body blockquote {
  margin: 26px 0;
  padding: 18px 24px;
  background: linear-gradient(135deg, rgba(236,254,255,0.8), rgba(204,251,241,0.4));
  border-left: 4px solid var(--c-primary-light);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  color: var(--c-ink-soft);
  font-size: 16px;
  font-style: italic;
  position: relative;
}
.markdown-body blockquote::before {
  content: '"';
  position: absolute;
  top: -8px; left: 14px;
  font-size: 50px;
  color: rgba(6,182,212,0.2);
  font-family: var(--font-serif);
  line-height: 1;
}

.markdown-body ul, .markdown-body ol {
  margin: 18px 0 22px;
  padding-left: 24px;
}
.markdown-body li { margin-bottom: 10px; }
.markdown-body ul li::marker { color: var(--c-primary); }
.markdown-body ol li::marker { color: var(--c-primary); font-weight: 600; }

.markdown-body code {
  font-family: 'SF Mono', 'Fira Code', Consolas, monospace;
  font-size: 0.88em;
  background: rgba(6, 182, 212, 0.1);
  color: var(--c-primary-dark);
  padding: 2px 7px;
  border-radius: 5px;
}
.markdown-body pre {
  margin: 22px 0;
  padding: 20px 24px;
  background: #0f172a;
  border-radius: var(--radius-sm);
  overflow-x: auto;
  box-shadow: var(--shadow-md);
}
.markdown-body pre code {
  background: none;
  color: #e2e8f0;
  padding: 0;
  font-size: 14px;
  line-height: 1.7;
}

.markdown-body table {
  width: 100%;
  margin: 24px 0;
  border-collapse: collapse;
  font-size: 15px;
  border-radius: var(--radius-sm);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}
.markdown-body th {
  background: linear-gradient(135deg, var(--c-primary), var(--c-primary-light));
  color: #fff;
  font-weight: 600;
  padding: 12px 16px;
  text-align: left;
}
.markdown-body td {
  padding: 12px 16px;
  border-bottom: 1px solid var(--c-line);
  background: rgba(255,255,255,0.6);
}
.markdown-body tr:last-child td { border-bottom: none; }
.markdown-body tr:hover td { background: rgba(236,254,255,0.6); }

.markdown-body hr {
  border: none;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--c-line), transparent);
  margin: 40px 0;
}

/* 文章底部导航 */
.article-nav {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  margin-top: 56px;
  padding-top: 32px;
  border-top: 1px solid var(--c-line);
}
.nav-card {
  flex: 1;
  padding: 18px 22px;
  background: var(--bg-card);
  border-radius: var(--radius-sm);
  border: 1px solid rgba(255,255,255,0.6);
  transition: all 0.3s var(--ease);
  max-width: 48%;
}
.nav-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); border-color: rgba(6,182,212,0.3); }
.nav-card .label { font-size: 12px; color: var(--c-ink-mute); margin-bottom: 4px; }
.nav-card .title {
  font-family: var(--font-serif);
  font-size: 15px;
  font-weight: 600;
  color: var(--c-ink);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.nav-card.next { text-align: right; }
.nav-card.placeholder { visibility: hidden; }

/* ========================================
   标签页
   ======================================== */
.tags-page { max-width: var(--container); margin: 0 auto; }
.page-title {
  font-family: var(--font-serif);
  font-size: 32px;
  font-weight: 700;
  color: var(--c-primary-dark);
  text-align: center;
  margin-bottom: 12px;
}
.page-desc {
  text-align: center;
  color: var(--c-ink-soft);
  margin-bottom: 48px;
  font-size: 15px;
}

.tag-cloud {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  justify-content: center;
  margin-bottom: 56px;
}
.tag-cloud .tag {
  font-size: 15px;
  padding: 8px 20px;
  background: var(--bg-card);
  border: 1px solid rgba(255,255,255,0.6);
  box-shadow: var(--shadow-sm);
}
.tag-cloud .tag .tag-num {
  margin-left: 6px;
  font-size: 11px;
  opacity: 0.7;
  background: rgba(255,255,255,0.4);
  padding: 1px 7px;
  border-radius: 10px;
}

.tag-filtered-list { margin-top: 8px; }
.tag-filtered-list .article-card { margin-bottom: 18px; }

/* ========================================
   关于页
   ======================================== */
.about-page {
  max-width: 680px;
  margin: 0 auto;
}
.about-hero {
  text-align: center;
  margin-bottom: 48px;
}
.about-avatar {
  width: 100px; height: 100px;
  margin: 0 auto 20px;
  background: linear-gradient(135deg, var(--c-primary-light), var(--c-accent));
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 48px;
  box-shadow: 0 12px 40px rgba(8,145,178,0.3);
  animation: pulse 3s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { box-shadow: 0 12px 40px rgba(8,145,178,0.3); }
  50% { box-shadow: 0 12px 50px rgba(8,145,178,0.5); }
}
.about-content {
  background: var(--bg-card);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.6);
  border-radius: var(--radius);
  padding: 40px 36px;
  box-shadow: var(--shadow-sm);
}
.about-content .markdown-body { font-size: 16px; }
.about-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin: 32px 0;
}
.stat-item {
  text-align: center;
  padding: 20px 12px;
  background: rgba(236,254,255,0.5);
  border-radius: var(--radius-sm);
}
.stat-num {
  font-family: var(--font-serif);
  font-size: 28px;
  font-weight: 700;
  color: var(--c-primary);
}
.stat-label { font-size: 12px; color: var(--c-ink-mute); margin-top: 4px; }

/* ========================================
   页脚
   ======================================== */
.site-footer {
  background: rgba(255, 255, 255, 0.5);
  backdrop-filter: blur(12px);
  border-top: 1px solid rgba(226, 232, 240, 0.6);
  margin-top: 40px;
}
.footer-inner {
  max-width: var(--container-wide);
  margin: 0 auto;
  padding: 40px 24px;
  display: grid;
  grid-template-columns: 1.5fr 1fr 1.5fr;
  gap: 32px;
}
.footer-logo {
  font-family: var(--font-serif);
  font-size: 18px;
  font-weight: 700;
  color: var(--c-primary-dark);
  display: block;
  margin-bottom: 8px;
}

    content: `# 浴室里的哲学时刻

当温水淋过头顶，那些白天紧绷的逻辑突然松动了。

我发现自己开始想一些没用的事——人为什么怕死，为什么喜欢在夜里思考，为什么水声让人安静。

## 水声是一种白噪音

据说白噪音能屏蔽杂念，让大脑进入一种"低阻力"的状态。淋浴时，水流持续地、均匀地响着，像一层薄薄的幕布，把外面的世界隔开。

> 在水声里，你不是谁的父亲、谁的下属、谁的邻居。你只是一具被温水包裹的肉体。

这大概是现代人少有的、完全属于自己的时刻。

## 那些没用的念头

有意思的是，正是在这种"没用"的状态下，大脑反而开始运转：

- 白天卡住的文案，突然有了开头
- 想不通的人际关系，忽然换了个角度
- 甚至会冒出一些宏大到荒谬的命题：宇宙有没有边界？

## 所以这本"沐浴录"

我决定把这些转瞬即逝的念头记下来。不是为了深刻，而是为了诚实——

记录下大脑真正"放空"后浮上来的东西，那些才是我真正的想法。`

不再试图在浴室里"写作"，而是允许它们消散。洗完后，只回忆**记得最清楚的那一个**。

我发现洗澡水的温度，其实是一种情绪的开关。

热水让人柔软，冷水让人清醒，温水让人发呆。我渐渐学会用水温来调节自己。

工作日晚上，我会把水温调高一点。当热水冲过后颈，整个人像被泡软了——

肌肉放松，呼吸变慢，那些白天压着的焦虑也跟着水流一起往下走。

**热水澡是一种告别。** 跟这一天告别，跟那些来不及处理的情绪告别。

## 冷水：把混沌的我敲醒

周末睡到中午，脑子还是糊的。这时候我拧到冷水。

| 水温 | 感受 | 适合 |
|------|------|------|
| 热水 | 柔软、释放 | 疲惫的夜晚 |
| 温水 | 发呆、漂浮 | 无事的午后 |
| 冷水 | 清醒、锐利 | 迷茫的早晨 |

冷水浇下来的那一下，整个人会"弹"起来。不是疼，是一种突然的、清醒的锐利。

温水最危险，也最舒服。

> 想到过去某个夏天，想到一个久未联系的人，想到一些说不上来是好是坏的往事。

温水澡是一种**漂浮**。适合那些不想思考、也不想逃避的日子。

## 所以

我现在很清楚自己需要什么：

- 想收尾，就调热
- 想清醒，就调冷
- 想发呆，就调温

水温成了一种**自我开药**的方式。比酒精温和，比咖啡诚实。`

    cover: '💡',
    content: `# 那些在淋浴中诞生的点子

我相信好的点子偏爱放松的大脑——淋浴时没有任务、没有评判，念头才敢冒头。

## 为什么偏偏是洗澡？

心理学上有个说法，叫**"默认模式网络"**。

当人不再专注于某项具体任务时，大脑反而会开始在后台"自由连接"。淋浴恰好提供了这种条件：

- 水声屏蔽了外界干扰
- 重复的动作不需要注意力
- 温暖让身体放松、警觉降低

于是那些白天被压抑的、看起来"不相关"的想法，开始自由地碰撞。

## 我的"沐浴点子"清单

记录几个真正在洗澡时冒出来、后来真的用上了的点子：

1. **一篇稿子的开头**——卡了三天，洗澡时突然想到可以用一个场景切入
2. **一个朋友的名字**——怎么都想不起来，洗澡到一半突然蹦出来
3. **一个生活决定**——纠结了一周，水流里忽然有了答案

## 但有个前提

点子冒头，不代表它是对的。**浴室里的灵感，冲动多于判断。**

所以我立了个规矩：洗澡时冒出来的"决定"，至少晾到第二天早上再执行。

> 让它过一夜，看看是真正的答案，还是只是热水的幻觉。

## 结语

如果你正在为一个问题发愁，也许可以试试：

关掉电脑，去洗个澡。

不是逃避，是换一种方式去想。`

夜里洗澡和白天洗澡是两件事。

白天的澡是"清洁"，深夜的澡是"独处"。

在所有人都睡去之后，浴室成了这座城市最后亮着的一盏灯。

## 十二点之后的水声

深夜洗澡时，水声听起来是不一样的。

白天它淹没在城市的噪音里，是背景。深夜它变成前景——你能听见水流击中瓷砖的每一声"啪嗒"，能分辨出水柱和细流的差别。

> 世界安静下来之后，连水的声音都变得清晰了。

## 镜子里的雾气

热水蒸腾，镜子蒙上一层雾。

我有时候会在上面画一笔——画什么不重要，重要的是**在雾气里留下痕迹**这件事本身。几分钟后它会自己消失，像什么都没发生过。

这大概就是深夜独有的浪漫：你知道它留不住，但还是想做一下。

## 深夜的浴室是安全的

白天我们表演"正常"，深夜才允许自己"奇怪"：

- 在淋浴时小声唱歌，哪怕跑调
- 对着水流自言自语，把白天没说出口的话说出来
- 允许自己软弱几分钟，因为没人看见

**深夜的浴室是一间免责的房间。** 在这里你可以不是任何角色，只是你自己。

## 写在最后

我不推荐每天都深夜洗澡——太耗神，也容易失眠。

但偶尔，在一个特别累、或特别空的夜晚，把自己关进浴室，让热水替你说话一会儿。

那种感觉，是白天给不了的。`

    excerpt: '洗完热水澡，镜子总是先糊后清。我看着雾气一点点散去，忽然觉得这像极了记忆——刚经历时什么都看不清，时间久了轮廓才慢慢显现。',
    cover: '🪞',
    content: `# 镜子上的雾气

洗完热水澡，镜子总是先糊后清。

我看着雾气一点点散去，忽然觉得这像极了记忆——刚经历时什么都看不清，时间久了轮廓才慢慢显现。

## 雾气是一种"延迟"

刚洗完澡，镜子里什么都看不见。只能凭感觉知道"那里应该有一张脸"。

要等。等水汽凝结、下滑、蒸发，镜面才一点点还给你——先是模糊的人形，然后是五官，最后是清晰的自己。

**这个过程，没法加速。**

## 记忆也是这样

刚经历一件事时，你往往看不清它。情绪太大，细节太满，反而一片混沌。

- 恋爱刚结束时，你以为自己想清楚了，其实没有
- 一场冲突刚发生，你以为抓住了重点，其实漏了关键的
- 一段经历刚结束，你以为懂得了，其实只是"经过"了

> 真正的"看见"，总是要等到雾气散去之后。

## 所以别急着下结论

我现在有个习惯：**重要的事，晾三天再判断。**

不是因为不信任当下的感受，而是因为当下的感受往往被"雾气"笼罩——

太近、太烫、太满。等它冷却、沉淀，轮廓才会自己浮现。

就像镜子，**给它一点时间，它会把真相还给你。**

## 雾散之后

有意思的是，等雾气散尽，镜子里的人其实还是那个人。

没有变好看，也没有变难看，只是——**终于看清楚了。**

很多事都是这样。雾散之后你会发现，当初的纠结、当初的狂喜，都不过是因为看不清。

看清了，反而平静。`

  <script data-page-node-id="5TbtUwQnyA5qqohdtxkzsz" data-pnid-children="FB3x9SoZB8a2UIKB7LJeYG">
/**
 * 沐浴录 · 应用逻辑
 * 基于 hash 路由的单页应用
 */
(function () {
  'use strict';

  const app = document.getElementById('app');
  const navToggle = document.getElementById('navToggle');
  const mainNav = document.getElementById('mainNav');
  const backToTop = document.getElementById('backToTop');
  const siteHeader = document.getElementById('siteHeader');

  // marked 配置
  if (window.marked) {
    marked.setOptions({ breaks: true, gfm: true });
  }

  /* ---------- 工具函数 ---------- */
  const $ = (sel, parent = document) => parent.querySelector(sel);

  function formatDate(dateStr) {
    const d = new Date(dateStr);
    const months = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
    return `${d.getFullYear()} 年 ${months[d.getMonth()]} ${d.getDate()} 日`;
  }

  function calcReadingTime(content) {
    // 中文按字数估算，约 400 字/分钟
    const text = content.replace(/[#*>`\-\[\]\(\)!]/g, '');
    const chars = text.length;
    return Math.max(1, Math.ceil(chars / 400));
  }

  function getTagColor(tag) {
    return TAG_COLORS[tag] || '#0891b2';
  }

  function tagHTML(tag, clickable = true) {
    const color = getTagColor(tag);
    const style = `style="background:${color}1a;color:${color}"`;
    const onclick = clickable ? ` onclick="event.stopPropagation();location.hash='#/tags/${encodeURIComponent(tag)}'"` : '';
    return `<span class="tag" ${style} ${onclick}>${tag}</span>`;
  }

  // 按 date 降序
  const sortedArticles = [...ARTICLES].sort((a, b) => new Date(b.date) - new Date(a.date));

  function findArticle(id) {
    return ARTICLES.find(a => a.id === id);
  }

  /* ---------- 页面渲染器 ---------- */

  // 首页
  function renderHome() {
    const cards = sortedArticles.map(a => `
      <article class="article-card page-enter" onclick="location.hash='#/article/${a.id}'">
        <span class="card-cover">${a.cover}</span>
        <div class="card-date">${formatDate(a.date)}</div>
        <h3 class="card-title">${a.title}</h3>
        <p class="card-excerpt">${a.excerpt}</p>
        <div class="card-tags">
          ${a.tags.map(t => tagHTML(t, true)).join('')}
        </div>
      </article>
    `).join('');

    return `
      <section class="hero page-enter">
        <span class="hero-emoji">🚿</span>
        <h1>${SITE.name}</h1>
        <p class="hero-tagline">${SITE.description}</p>
        <div class="hero-wave"></div>
      </section>
      <section>
        <div class="section-head">
          <h2>思绪录</h2>
          <span class="count">共 ${ARTICLES.length} 篇</span>
        </div>
        <div class="article-grid">${cards}</div>
      </section>
    `;
  }

  // 文章详情
  function renderArticle(id) {
    const article = findArticle(id);
    if (!article) {
      return `<div class="empty-state"><span class="emoji">🫧</span><p>这篇文章似乎被水冲走了……</p><p style="margin-top:16px"><a href="#/" style="color:var(--c-primary)">返回首页</a></p></div>`;
    }

    const idx = sortedArticles.findIndex(a => a.id === id);
    const prev = idx < sortedArticles.length - 1 ? sortedArticles[idx + 1] : null;
    const next = idx > 0 ? sortedArticles[idx - 1] : null;
    const reading = calcReadingTime(article.content);

    const contentHtml = window.marked ? marked.parse(article.content) : `<pre>${article.content}</pre>`;

    return `
      <article class="article-detail">
        <a href="#/" class="back-link page-enter">← 返回文章列表</a>
        <header class="detail-header page-enter">
          <span class="detail-cover">${article.cover}</span>
          <h1 class="detail-title">${article.title}</h1>
          <div class="detail-meta">
            <span>📅 ${formatDate(article.date)}</span>
            <span class="sep">·</span>
            <span class="reading">☕ ${reading} 分钟阅读</span>
          </div>
          <div class="detail-tags">
            ${article.tags.map(t => tagHTML(t, true)).join('')}
          </div>
        </header>
        <div class="markdown-body page-enter">${contentHtml}</div>
        <nav class="article-nav">
          ${prev ? `<a class="nav-card prev" href="#/article/${prev.id}"><div class="label">← 上一篇</div><div class="title">${prev.title}</div></a>` : '<div class="nav-card placeholder"></div>'}
          ${next ? `<a class="nav-card next" href="#/article/${next.id}"><div class="label">下一篇 →</div><div class="title">${next.title}</div></a>` : '<div class="nav-card placeholder"></div>'}
        </nav>
      </article>
    `;
  }

  // 标签页
  function renderTags() {
    // 统计每个标签的文章数
    const tagCount = {};
    ARTICLES.forEach(a => a.tags.forEach(t => { tagCount[t] = (tagCount[t] || 0) + 1; }));
    const tags = Object.keys(tagCount).sort((a, b) => tagCount[b] - tagCount[a]);

    const cloud = tags.map(t => {
      const c = getTagColor(t);
      return `<span class="tag" style="background:${c}1a;color:${c}" onclick="location.hash='#/tags/${encodeURIComponent(t)}'">
        ${t}<span class="tag-num">${tagCount[t]}</span>
      </span>`;
    }).join('');

    return `
      <section class="tags-page">
        <h1 class="page-title page-enter">标签云</h1>
        <p class="page-desc page-enter">每一段思绪都有自己的归处——点击标签，翻阅同类念想。</p>
        <div class="tag-cloud page-enter">${cloud}</div>
        <div class="section-head">
          <h2>全部文章</h2>
          <span class="count">${ARTICLES.length} 篇</span>
        </div>
        <div class="article-grid">
          ${sortedArticles.map(a => `
            <article class="article-card page-enter" onclick="location.hash='#/article/${a.id}'">
              <span class="card-cover">${a.cover}</span>
              <div class="card-date">${formatDate(a.date)}</div>
              <h3 class="card-title">${a.title}</h3>
              <p class="card-excerpt">${a.excerpt}</p>
              <div class="card-tags">${a.tags.map(t => tagHTML(t, true)).join('')}</div>
            </article>
          `).join('')}
        </div>
      </section>
    `;
  }

  // 按标签筛选
  function renderTagFilter(tag) {
    const filtered = sortedArticles.filter(a => a.tags.includes(tag));
    if (filtered.length === 0) {
      return `<div class="empty-state"><span class="emoji">🏷️</span><p>没有找到标签为「${tag}」的文章</p></div>`;
    }

    return `
      <section class="tags-page">
        <a href="#/tags" class="back-link page-enter">← 全部标签</a>
        <h1 class="page-title page-enter">#${tag}</h1>
        <p class="page-desc page-enter">共 ${filtered.length} 篇与「${tag}」相关的思绪</p>
        <div class="tag-filtered-list">
          ${filtered.map(a => `
            <article class="article-card page-enter" onclick="location.hash='#/article/${a.id}'">
              <span class="card-cover">${a.cover}</span>
              <div class="card-date">${formatDate(a.date)}</div>
              <h3 class="card-title">${a.title}</h3>
              <p class="card-excerpt">${a.excerpt}</p>
              <div class="card-tags">${a.tags.map(t => tagHTML(t, true)).join('')}</div>
            </article>
          `).join('')}
        </div>
      </section>
    `;
  }

  // 关于页
  function renderAbout() {
    const aboutContent = `## 关于这本「沐浴录」

我有一个习惯——洗澡时，大脑会自动"放空"。

不是冥想那种刻意的放空，而是真的什么都不想，任由水流冲着，念头却自己一个接一个地浮上来。

有的是灵感，有的是牢骚，有的是对某件小事突然的释怀，有的甚至只是一句没头没尾的话。

它们都**转瞬即逝**——擦干头发之后就忘掉大半。

于是我建了这里，把它们记下来。

## 为什么是"沐浴"

不是因为洗澡本身有多重要，而是因为洗澡是现代人少有的、**真正属于自己的时刻**：

- 没有屏幕
- 没有任务
- 没有别人的目光

只剩自己，和水声。

## 你会在这里读到什么

这里的文字**不追求深刻，只追求诚实**。

它们大多诞生于浴室，或者洗澡前后。有的是深夜的独白，有的是清晨的清醒，有的是温水里的发呆。

> 如果你也在洗澡时想过些没用的事，那我们大概是同类。`;

    const contentHtml = window.marked ? marked.parse(aboutContent) : aboutContent;

    return `
      <section class="about-page">
        <div class="about-hero page-enter">
          <div class="about-avatar">🚿</div>
          <h1 class="page-title" style="margin-bottom:8px">${SITE.author}</h1>
          <p class="page-desc" style="margin-bottom:0">${SITE.tagline}</p>
        </div>
        <div class="about-content page-enter">
          <div class="markdown-body">${contentHtml}</div>
          <div class="about-stats">
            <div class="stat-item">
              <div class="stat-num">${ARTICLES.length}</div>
              <div class="stat-label">篇思绪</div>
            </div>
            <div class="stat-item">
              <div class="stat-num">${new Set(ARTICLES.flatMap(a => a.tags)).size}</div>
              <div class="stat-label">个标签</div>
            </div>
            <div class="stat-item">
              <div class="stat-num">${ARTICLES.reduce((s, a) => s + calcReadingTime(a.content), 0)}</div>
              <div class="stat-label">分钟可读</div>
            </div>
          </div>
        </div>
      </section>
    `;
  }

  /* ---------- 路由 ---------- */
  function router() {
    const hash = location.hash.slice(1) || '/';
    const parts = hash.split('/').filter(Boolean); // ['article','xxx'] 或 ['tags'] 或 ['tags','灵感'] 或 ['about'] 或 []
    const app = document.getElementById('app');

    let html = '';
    let activeRoute = '';

    if (parts.length === 0) {
      html = renderHome();
      activeRoute = 'home';
    } else if (parts[0] === 'article' && parts[1]) {
      html = renderArticle(parts[1]);
      activeRoute = 'home';
    } else if (parts[0] === 'tags' && !parts[1]) {
      html = renderTags();
      activeRoute = 'tags';
    } else if (parts[0] === 'tags' && parts[1]) {
      html = renderTagFilter(decodeURIComponent(parts[1]));
      activeRoute = 'tags';
    } else if (parts[0] === 'about') {
      html = renderAbout();
      activeRoute = 'about';
    } else {
      html = `<div class="empty-state"><span class="emoji">🫧</span><p>找不到这个页面</p><p style="margin-top:16px"><a href="#/" style="color:var(--c-primary)">返回首页</a></p></div>`;
    }

    app.innerHTML = html;

    // 高亮导航
    document.querySelectorAll('.main-nav a').forEach(a => {
      a.classList.toggle('active', a.dataset.route === activeRoute);
    });

    // 关闭移动端菜单
    mainNav.classList.remove('open');
    navToggle.classList.remove('open');

    // 滚动到顶部
    window.scrollTo({ top: 0, behavior: 'auto' });
  }

  /* ---------- 交互 ---------- */

  // 移动端菜单切换
  navToggle.addEventListener('click', () => {
    mainNav.classList.toggle('open');
    navToggle.classList.toggle('open');
  });

  // 点击导航链接外区域关闭菜单
  document.addEventListener('click', (e) => {
    if (!mainNav.contains(e.target) && !navToggle.contains(e.target)) {
      mainNav.classList.remove('open');
      navToggle.classList.remove('open');
    }
  });

  // 滚动：显示返回顶部 + header 阴影
  window.addEventListener('scroll', () => {
    const scrolled = window.scrollY > 400;
    backToTop.classList.toggle('show', scrolled);
    siteHeader.classList.toggle('scrolled', window.scrollY > 10);
  }, { passive: true });

  // 返回顶部
  backToTop.addEventListener('click', () => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  // 路由监听
  window.addEventListener('hashchange', router);
  window.addEventListener('DOMContentLoaded', router);

  // 若 DOM 已加载则立即执行
  if (document.readyState !== 'loading') {
    router();
  }
})();

</script>
</body>
</html>
